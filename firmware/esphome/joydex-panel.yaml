    state: PRESSED

  - platform: lvgl
    id: task_4_pressed
    name: Task 4
    widget: task_4_card
    state: PRESSED

  - platform: lvgl
    id: sidebar_pressed
    name: Sidebar
    widget: sidebar_button
    state: PRESSED

lvgl:
