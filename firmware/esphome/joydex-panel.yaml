substitutions:
  device_name: joydex-panel
  friendly_name: Joydex Panel

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.2
  project:
    name: joydex.wireless_touchscreen
    version: 0.1.0

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  hardware_uart: UART0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

web_server:
  port: 80
  version: 3
  auth:
    username: !secret web_server_username
    password: !secret web_server_password
    type: digest
  log: false
  ota: false

ota:
  - platform: esphome
    password: !secret ota_password

output:
  - platform: ledc
    id: backlight_output
    pin: GPIO38
    frequency: 150Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    id: display_backlight
    name: Backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

i2c:
  id: touchscreen_bus
  sda: GPIO19
  scl:
    number: GPIO45
    ignore_strapping_warning: true

display:
  - platform: mipi_rgb
    id: tft_display
    model: GUITION-4848S040
    spi_id: lcd_spi
    # Keep the exact C_I timings explicit until ESPHome issue #17810 is fixed.
    spi_mode: MODE3
    hsync_pulse_width: 8
    hsync_front_porch: 10
    hsync_back_porch: 20
    vsync_pulse_width: 8
    vsync_front_porch: 10
    vsync_back_porch: 10
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - platform: gt911
    id: tft_touch
    i2c_id: touchscreen_bus
    display: tft_display
    transform:
      mirror_x: true
      mirror_y: true

select:
  - platform: template
    id: task_1_state
    name: Task 1 State
    optimistic: true
    restore_value: false
    initial_option: EMPTY
    options:
      - EMPTY
      - RUNNING
      - ATTENTION
      - COMPLETE
    on_value:
      then:
        - lvgl.widget.update:
            id: task_1_card
            bg_color: !lambda |-
              if (x == "RUNNING") {
                return lv_color_make(255, 255, 255);
              }
              if (x == "ATTENTION") {
                return lv_color_make(244, 211, 94);
              }
              if (x == "COMPLETE") {
                return lv_color_make(35, 155, 86);
              }
              return lv_color_make(107, 114, 128);
            border_width: !lambda |-
              return (x == "RUNNING" || x == "ATTENTION") ? 2 : 0;
            pressed:
              border_color: 0x66D9EF
              border_width: 8
        - lvgl.label.update:
            id: task_1_title_label
            text: !lambda |-
              return std::string(x == "EMPTY" ? "" : "TASK 1");
            text_color: !lambda |-
              return x == "COMPLETE"
                ? lv_color_make(255, 255, 255)
                : lv_color_make(82, 82, 82);
        - lvgl.label.update:
            id: task_1_state_label
            text: !lambda |-
              if (x == "EMPTY") {
                return "";
              }
              if (x == "ATTENTION") {
                return "WAITING";
              }
              if (x == "COMPLETE") {
                return "DONE";
              }
              return x;
            text_color: !lambda |-
              return x == "COMPLETE"
                ? lv_color_make(255, 255, 255)
                : lv_color_make(82, 82, 82);

