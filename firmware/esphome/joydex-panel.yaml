binary_sensor:
  - platform: lvgl
    id: task_1_pressed
    name: Task 1
    widget: task_1_card
    state: PRESSED

  - platform: lvgl
    id: task_2_pressed
    name: Task 2
    widget: task_2_card
    state: PRESSED

  - platform: lvgl
    id: task_3_pressed
