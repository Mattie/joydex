lvgl:
  displays:
    - tft_display
  touchscreens:
    - touchscreen_id: tft_touch
  page_wrap: false
  on_boot:
    - lvgl.page.show: main_page
  bottom_layer:
    bg_color: 0x09060D
    bg_opa: COVER
  pages:
    - id: main_page
      bg_color: 0x09060D
      bg_opa: COVER
      border_width: 0
      pad_all: 0
      scrollbar_mode: "OFF"
      widgets:
        # Static retro-futuristic bridge chrome. These objects never change after boot,
        # keeping button and status redraws local to the affected control.
        - obj:
            x: 8
            y: 8
            width: 464
            height: 56
            radius: 28
            border_width: 0
            bg_color: 0xF1A15F
