            height: 118
            radius: 10
            border_width: 0
            bg_color: 0xB79AD8
        - obj:
            x: 8
            y: 296
            width: 56
            height: 54
            radius: 10
            border_width: 0
            bg_color: 0x66D9EF

        - label:
            x: 72
            y: 18
            width: 392
            height: 36
            text: JOYDEX PAD
            text_font: montserrat_28
            text_color: 0x09060D
            text_align: CENTER

        - button:
            id: task_1_card
