packages:
  tunable_wake: !include joydex-voice-pe-tunable-wake-canary.yaml

esphome:
  project:
    name: Joydex.Voice PE Audio Bridge
    version: "0.1.41"

globals:
  - id: joydex_voice_ready_cue_pending
    type: bool
    restore_value: no
    initial_value: "true"
  - id: joydex_voice_end_cue_pending
    type: bool
    restore_value: no
    initial_value: "false"
  - id: joydex_voice_session_was_active
    type: bool
    restore_value: no
    initial_value: "false"

binary_sensor:
  - platform: template
    id: joydex_voice_hangup
    name: Joydex Voice Hangup
    entity_category: diagnostic
  - platform: template
    id: joydex_voice_toggle_mute
    name: Joydex Voice Toggle Mute
    entity_category: diagnostic

light:
  - id: !extend voice_assistant_leds
    effects:
      - addressable_lambda:
          name: "Joydex Voice Muted"
          update_interval: 450ms
          lambda: |-
            static bool visible = true;
            if (initial_run) {
              visible = true;
            }
            const Color yellow(255, 191, 0);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = visible ? yellow : Color::BLACK;
            }
            visible = !visible;

script:
  - id: joydex_voice_hangup_pulse
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: joydex_voice_hangup
          state: ON
      - delay: 250ms
      - binary_sensor.template.publish:
          id: joydex_voice_hangup
          state: OFF

  - id: joydex_voice_toggle_mute_pulse
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: joydex_voice_toggle_mute
          state: ON
      - delay: 250ms
      - binary_sensor.template.publish:
          id: joydex_voice_toggle_mute
          state: OFF

  - id: control_leds_joydex_voice_muted
    then:
      - light.turn_on:
          brightness: !lambda return max(id(led_ring).current_values.get_brightness(), 0.2f);
          id: voice_assistant_leds
          effect: "Joydex Voice Muted"
