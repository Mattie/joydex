substitutions:
  # Public source uses a neutral identity; operators should select a unique local name.
  name: joydex-voice-pe
  friendly_name: Joydex Voice PE

packages:
  home_assistant_voice_pe: !include home-assistant-voice.yaml

# Use the exact ESPHome component revision behind the accepted 0.1.6 image.
# The only component change retains wake and VAD peaks, including VAD-blocked wake scores.
external_components:
  - source:
      type: local
      path: .joydex-esphome/esphome/components
    components:
      - micro_wake_word

# The pinned 2025.12.2 microWakeWord component permits esp-nn ^1.1.0. Without an
# explicit constraint, a later build can resolve kernels that exceed these models'
# tensor arenas. Preserve the dependency set from the detecting 0.1.6 image.
esp32:
  framework:
    components:
      - espressif/esp-nn==1.1.2

esphome:
  project:
    name: Joydex.Voice PE Score Diagnostic
    version: "0.1.9"
  on_boot:
    # Preserve the retail Voice PE boot sequence that the overlay previously replaced.
    - priority: 375
      then:
        - script.execute: control_leds
        - delay: 1s
        - switch.turn_on: internal_speaker_amp
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    # Start after all audio components have completed setup.
    - priority: -100
      then:
        # This is the exact 0.1.6 model set and startup sequence. Only Okay Computer
        # and VAD remain enabled so the Voice PE tensor arenas fit.
        - micro_wake_word.disable_model: okay_nabu
        - micro_wake_word.disable_model: hey_jarvis
        - micro_wake_word.disable_model: hey_mycroft
        - micro_wake_word.disable_model: stop
        - delay: 2s
        - micro_wake_word.start:
        - wait_until:
            condition:
              lambda: return id(mww).is_running();
            timeout: 5s
        - if:
            condition:
              lambda: return id(mww).is_running();
            then:
              - lambda: |-
                  id(init_in_progress) = false;
                  id(voice_assistant_phase) = 1;
              - script.execute: control_leds

# Joydex uses a trusted-LAN, outbound-only diagnostics connection.
api:
  encryption: !remove

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Joydex Voice PE Recovery
    password: !secret web_server_password

captive_portal:

web_server:
  port: 80
  version: 3
  include_internal: true
  ota: false
  log: true

binary_sensor:
  - platform: template
    id: joydex_voice_wake
    name: Joydex Voice Wake
    device_class: sound
  - platform: template
    id: joydex_wake_engine_running
    name: Joydex Wake Engine Running
    entity_category: diagnostic
    lambda: return id(mww).is_running();
  - platform: template
    id: joydex_microphone_capturing
    name: Joydex Microphone Capturing
    entity_category: diagnostic
    lambda: return id(i2s_mics).is_running();
  - platform: template
    id: joydex_microphone_muted
    name: Joydex Microphone Muted
    entity_category: diagnostic
    lambda: return id(i2s_mics).get_mute_state();
  - platform: template
    id: joydex_vad_active
    name: Joydex VAD Active
    entity_category: diagnostic
    lambda: return id(mww).get_vad_state();

sensor:
  # These values are quantized model probabilities converted back to 0.000-1.000.
  # Peaks include samples that VAD would block and remain available until reset.
  # A one-second update interval avoids flooding the LAN event stream.
  - platform: template
    name: Joydex Wake Peak Average Score
    id: joydex_wake_peak_average_score
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(mww).get_wake_peak_average_probability() / 255.0f;
    filters:
      - delta: 0.001
  - platform: template
    name: Joydex Wake Peak Maximum Score
    id: joydex_wake_peak_maximum_score
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(mww).get_wake_peak_max_probability() / 255.0f;
    filters:
      - delta: 0.001
  - platform: template
    name: Joydex VAD Peak Average Score
    id: joydex_vad_peak_average_score
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(mww).get_vad_peak_average_probability() / 255.0f;
    filters:
      - delta: 0.001
  - platform: template
    name: Joydex VAD Peak Maximum Score
    id: joydex_vad_peak_maximum_score
    entity_category: diagnostic
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(mww).get_vad_peak_max_probability() / 255.0f;
    filters:
      - delta: 0.001
  - platform: template
    name: Joydex Score Generation
    id: joydex_score_generation
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 1s
    lambda: return id(mww).get_score_generation();
    filters:
      - delta: 1

button:
  - platform: template
    name: Joydex Reset Score Peaks
    id: joydex_reset_score_peaks
    entity_category: diagnostic
    on_press:
      - lambda: id(mww).reset_score_peaks();

script:
  - id: joydex_voice_wake_pulse
    mode: restart
    then:
      - binary_sensor.template.publish:
          id: joydex_voice_wake
          state: ON
      - delay: 250ms
      - binary_sensor.template.publish:
          id: joydex_voice_wake
          state: OFF
