substitutions:
  # The second cue confirms that Codex realtime and both media paths are ready.
  joydex_ready_sound_file: sounds/WakeBlip.flac

packages:
  score_sound_and_led: !include joydex-voice-pe-score-sound-canary.yaml

esphome:
  project:
    name: Joydex.Voice PE UDP Prototype
    version: "0.1.21"

# Native ESPHome OTA performs the entire firmware receive loop on the main
# application task. A half-closed LAN connection can strand that loop forever
# in ESPHome 2025.12.2. Keep the recoverable HTTP updater exposed on this
# trusted LAN and remove the native updater from the image after this upgrade.
ota:
  - id: !remove ota_esphome
  - platform: web_server
    id: joydex_web_ota

web_server:
  ota: !remove

external_components:
  - source:
      type: local
      path: components
    components:
      - joydex_udp_audio_prototype

media_source:
  - id: !extend file_source
    files:
      - id: joydex_ready_sound
        file: ${joydex_ready_sound_file}

# Feed 48 kHz UDPPCM directly into the existing mixer. This removes the host
# 48→24 kHz and device 24→48 kHz resampling pair from the transport canary.
speaker:
  - id: !extend mixing_speaker
    source_speakers:
      - id: joydex_voice_mixing_input
        timeout: never
        buffer_duration: 400ms

# Wake inference is useful only while the room endpoint is armed. Its task has
# a higher priority than ESPHome's resampler, so leaving it active throughout a
# duplex call can starve sustained speaker audio. Hand the shared microphone
# source to the LAN bridge while Starting/Listening, then restore inference as
# soon as Joydex returns the endpoint to Armed.
select:
  - id: !extend joydex_voice_session_state
    on_value:
      - if:
          condition:
            lambda: return x == "Starting" || x == "Listening";
          then:
            - script.stop: joydex_voice_rearm_wake_engine
            - script.execute: joydex_voice_use_session_microphone
      - if:
          condition:
            lambda: return x == "Armed" && !id(init_in_progress);
          then:
            - script.stop: joydex_voice_use_session_microphone
            - script.execute: joydex_voice_rearm_wake_engine
      - if:
          condition:
            lambda: return x == "Listening" && id(joydex_audio_bridge).is_session_active();
          then:
            - script.execute:
                id: play_sound
                priority: true
                sound_file: "joydex_ready_sound"

script:
  - id: joydex_voice_use_session_microphone
    mode: single
    then:
      - if:
          condition:
            lambda: return id(mww).is_running();
          then:
            - micro_wake_word.stop:
            - wait_until:
                condition:
                  lambda: return !id(mww).is_running();
                timeout: 5s
      - if:
          condition:
            lambda: return !id(mww).is_running();
          then:
            - lambda: |-
                id(wake_word_mic).start();
                ESP_LOGI("joydex.voice", "Wake inference paused; session microphone capture retained");
          else:
            - lambda: ESP_LOGW("joydex.voice", "Wake inference did not pause before session audio");

  - id: joydex_voice_rearm_wake_engine
    mode: restart
    then:
      # Select-state publication and UDP session close are independent LAN
      # messages. Never let an early Armed update stop the microphone or
      # restart inference while the audio bridge still owns a live session.
      # A later Starting/Listening update cancels this wait above.
      - wait_until:
          condition:
            lambda: return !id(joydex_audio_bridge).is_session_active();
      - if:
          condition:
            lambda: return id(mww).is_running();
          then:
            - micro_wake_word.stop:
            - wait_until:
                condition:
                  lambda: return !id(mww).is_running();
                timeout: 5s
      - if:
          condition:
            lambda: return !id(mww).is_running();
          then:
            - lambda: id(wake_word_mic).stop();
            - micro_wake_word.start:
            - wait_until:
                condition:
                  lambda: return id(mww).is_running();
                timeout: 5s
            - if:
                condition:
                  lambda: return id(mww).is_running();
                then:
                  - lambda: ESP_LOGI("joydex.voice", "Wake inference rearmed after session audio");
                else:
                  - lambda: ESP_LOGE("joydex.voice", "Wake inference did not rearm after session audio");

switch:
  - platform: template
    id: joydex_audio_barge_in
    name: Joydex Audio Barge In
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

joydex_udp_audio_prototype:
  id: joydex_audio_bridge
  port: 8766
  microphone: wake_word_mic
  speaker: joydex_voice_mixing_input
  announcement_media_player: external_media_player
  barge_in_switch: joydex_audio_barge_in

binary_sensor:
  - platform: template
    name: Joydex Audio Connected
    entity_category: diagnostic
    lambda: return id(joydex_audio_bridge).is_connected();
  - platform: template
    name: Joydex Audio Session Active
    entity_category: diagnostic
    lambda: return id(joydex_audio_bridge).is_session_active();

sensor:
  - platform: template
    name: Joydex Audio Uplink Frames
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_uplink_frames();
  - platform: template
    name: Joydex Audio Uplink Dropped Bytes
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_uplink_dropped_bytes();
  - platform: template
    name: Joydex Audio Uplink Queue High Water Bytes
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_uplink_queue_high_water_bytes();
  - platform: template
    name: Joydex Audio Downlink Frames
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_frames();
  - platform: template
    name: Joydex Audio Downlink Dropped Bytes
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_dropped_bytes();
  - platform: template
    name: Joydex Audio Downlink Underruns
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_underruns();
  - platform: template
    name: Joydex Audio Downlink Queue High Water Bytes
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_queue_high_water_bytes();
  - platform: template
    name: Joydex Audio Speaker Accepted Bytes
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_speaker_accepted_bytes();
  - platform: template
    name: Joydex Audio Speaker Backpressure Events
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_speaker_backpressure_events();
  - platform: template
    name: Joydex Audio Speaker Partial Writes
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_speaker_partial_writes();
  - platform: template
    name: Joydex Audio Downlink Max Loop Gap Milliseconds
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_downlink_max_loop_gap_ms();
  - platform: template
    name: Joydex Audio UDP Uplink Send Drops
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_uplink_send_drops();
  - platform: template
    name: Joydex Audio UDP Uplink Send Max Microseconds
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_uplink_send_max_us();
  - platform: template
    name: Joydex Audio UDP Invalid Packets
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_invalid_packets();
  - platform: template
    name: Joydex Audio UDP Foreign Packets
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_foreign_packets();
  - platform: template
    name: Joydex Audio UDP Downlink Missing Packets
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_downlink_missing_packets();
  - platform: template
    name: Joydex Audio UDP Downlink Late Packets
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_downlink_late_packets();
  - platform: template
    name: Joydex Audio UDP Sessions
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_sessions();
  - platform: template
    name: Joydex Audio UDP Timeouts
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_udp_timeouts();
  - platform: template
    name: Joydex Audio Last Socket Errno
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 5s
    lambda: return id(joydex_audio_bridge).get_last_socket_errno();

text_sensor:
  - platform: template
    name: Joydex Audio Last Close Reason
    entity_category: diagnostic
    update_interval: 5s
    lambda: return std::string(id(joydex_audio_bridge).get_last_close_reason());
