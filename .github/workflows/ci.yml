name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Python for signaling protocol tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Test native Dot signaling without network access
        run: python -I .\tests\dot_signaling_test.py

      - name: Restore
        run: dotnet restore .\Joydex.sln

      - name: Audit transitive packages
        shell: pwsh
        run: |
          $audit = dotnet list .\Joydex.sln package --vulnerable --include-transitive
          $audit | Out-String | Write-Host
          if ($audit -match 'has the following vulnerable packages') {
            throw 'NuGet reported one or more vulnerable packages.'
          }

      - name: Build
        run: dotnet build .\Joydex.sln --configuration Release --no-restore

      - name: Build attended Dot canary
        run: dotnet build .\tools\Joydex.DotVoiceCanary\Joydex.DotVoiceCanary.csproj --configuration Release

      - name: Test
        # Keep independent test hosts from competing for the same small runner's CPU.
        # Tests within each project retain their normal parallelism.
        run: dotnet test .\Joydex.sln --configuration Release --no-build --no-restore -m:1
